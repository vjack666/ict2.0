name: Hermes A0-A9 Audit Stack

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  HERMES_AUDIT_MAX_ITER: '1'

jobs:
  audit-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run A0-A9 in sequence
        run: |
          set -euxo pipefail
          python -m audits.codigo.run_full_stack | tee audit-stack.log

      - name: Run audit tests
        run: |
          set -euxo pipefail
          python -m pytest -q tests/test_audit_stack.py tests/test_audit_subsystem.py --disable-warnings --maxfail=1

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-a0-a9-evidence
          path: |
            reports/audits/A0_A9_audit_stack.json
            audit-stack.log
