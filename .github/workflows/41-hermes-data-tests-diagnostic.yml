name: Hermes Data + Tests (Diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: STEP 01 - Checkout
        uses: actions/checkout@v4

      - name: STEP 02 - Audit runner and repository
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          pwd
          ls -la
          find .github -maxdepth 3 -type f -print | sort
          find tools data -maxdepth 4 -type f -print 2>/dev/null | sort || true

      - name: STEP 03 - Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: ''

      - name: STEP 04 - Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f setup.py ]; then pip install -e .; fi
          pip install pandas pyarrow requests pytest pytest-cov
          python -c "import pandas,pyarrow,requests,pytest; print('deps OK')"

      - name: STEP 05 - Acquire EURUSD H1/H4/D1
        shell: bash
        run: |
          set -euxo pipefail
          python tools/data/acquire_eurusd_higher_tf.py
          echo '=== GENERATED DATA ==='
          find data/raw/EURUSD data/metadata -maxdepth 1 -type f -print | sort
          cat data/metadata/EURUSD_H1_H4_D1.json

      - name: STEP 06 - Validate higher-timeframe datasets
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          for tf in ('H1','H4','D1'):
              p=Path(f'data/raw/EURUSD/EURUSD_{tf}.parquet')
              df=pd.read_parquet(p)
              assert not df.empty
              assert list(df.columns)==['time','open','high','low','close']
              assert df.time.is_monotonic_increasing
              assert not df.time.duplicated().any()
              assert not (df.high < df[['open','close']].max(axis=1)).any()
              assert not (df.low > df[['open','close']].min(axis=1)).any()
              assert not (df.high < df.low).any()
              print(tf, len(df), df.time.iloc[0], '->', df.time.iloc[-1])
          PY

      - name: STEP 07 - Run test suite
        shell: bash
        run: |
          set -euxo pipefail
          pytest -q --disable-warnings --maxfail=1

      - name: STEP 08 - Upload higher-timeframe datasets and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-H1-H4-D1-diagnostic-${{ github.run_id }}
          path: |
            data/raw/EURUSD/EURUSD_H1.csv
            data/raw/EURUSD/EURUSD_H4.csv
            data/raw/EURUSD/EURUSD_D1.csv
            data/raw/EURUSD/EURUSD_H1.parquet
            data/raw/EURUSD/EURUSD_H4.parquet
            data/raw/EURUSD/EURUSD_D1.parquet
            data/metadata/EURUSD_H1_H4_D1.json
          if-no-files-found: warn
          retention-days: 7

      - name: STEP 09 - Final status
        if: always()
        shell: bash
        run: |
          echo "workflow_run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "job_status=${{ job.status }}"
          echo "M5_STATUS=DEFERRED_NO_STABLE_PUBLIC_SOURCE"
