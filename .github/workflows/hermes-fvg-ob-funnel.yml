name: Hermes FVG OB Funnel

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run FVG OB relation tests
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q tests/test_fvg_ob_relations.py tests/test_phase_c_detectors.py tests/test_phase_d_lineage.py --disable-warnings --maxfail=1

      - name: Run cloud Funnel H1 H4 D1
        shell: bash
        run: |
          set -euxo pipefail
          python -m audits.codigo.fvg_ob_funnel | tee funnel.log

      - name: Validate report
        shell: bash
        run: |
          set -euxo pipefail
          test -s reports/audits/fvg_ob_funnel.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/audits/fvg_ob_funnel.json')
          data = json.loads(p.read_text())
          assert set(data['timeframes']) == {'H1','H4','D1'}
          for tf, item in data['timeframes'].items():
              assert item['audit_status'] == 'PASS', (tf, item['audit_status'])
              assert item['relation_count'] >= 0
              assert item['causal_links'] == item['relation_count']
          print('FVG_OB_FUNNEL_REPORT: PASS')
          PY

      - name: Upload Funnel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvg-ob-funnel-${{ github.sha }}
          path: |
            reports/audits/fvg_ob_funnel.json
            funnel.log
