name: Hermes Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify import path
        shell: bash
        run: |
          set -euxo pipefail
          python -c "import engine; from engine.market_object import MarketObject; print(engine.__file__)"

      - name: Run test suite
        shell: bash
        run: |
          set -euxo pipefail
          python -m pytest -q --disable-warnings --maxfail=1
