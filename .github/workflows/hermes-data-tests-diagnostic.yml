name: Hermes Data + Tests (Diagnostic)

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'UTC start date (YYYY-MM-DD)'
        required: true
        default: '2020-01-01'
      end:
        description: 'UTC end date, exclusive (YYYY-MM-DD)'
        required: true
        default: '2020-02-01'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: STEP 01 - Checkout
        uses: actions/checkout@v4

      - name: STEP 02 - Audit runner and repository
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          pwd
          ls -la
          find .github -maxdepth 3 -type f -print | sort
          find tools data -maxdepth 4 -type f -print 2>/dev/null | sort || true

      - name: STEP 03 - Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: ''

      - name: STEP 04 - Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f setup.py ]; then pip install -e .; fi
          pip install pandas pyarrow requests pytest pytest-cov
          python -c "import pandas,pyarrow,requests,pytest; print('deps OK')"

      - name: STEP 05 - Verify Node data client
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npm --version
          npx --yes dukascopy-node@1.50.0 --help

      - name: STEP 06 - Acquire EURUSD M5 via Dukascopy JSON client
        env:
          START: ${{ github.event.inputs.start || '2020-01-01' }}
          END: ${{ github.event.inputs.end || '2020-02-01' }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p data/raw/EURUSD data/metadata data/work/dukascopy
          echo "Requested range: ${START} -> ${END}"
          npx --yes dukascopy-node@1.50.0 \
            -i eurusd \
            -from "$START" \
            -to "$END" \
            -t m5 \
            -p bid \
            -v \
            -f csv \
            -dir data/work/dukascopy \
            -bs 5 \
            -bp 3000 \
            -r 5 \
            -rp 5000
          echo '=== DOWNLOADED FILES ==='
          find data/work/dukascopy -type f -maxdepth 4 -print | sort
          CSV=$(find data/work/dukascopy -type f -name '*.csv' | head -n 1)
          test -n "$CSV"
          echo "CSV=$CSV" >> "$GITHUB_ENV"

      - name: STEP 07 - Canonicalize + validate Parquet
        env:
          START: ${{ github.event.inputs.start || '2020-01-01' }}
          END: ${{ github.event.inputs.end || '2020-02-01' }}
        shell: bash
        run: |
          set -euxo pipefail
          python tools/data/finalize_eurusd_m5.py --csv "$CSV" --start "$START" --end "$END"
          ls -lh data/raw/EURUSD/EURUSD_M5.parquet data/metadata/EURUSD_M5.json data/metadata/EURUSD_M5.sha256
          cat data/metadata/EURUSD_M5.json

      - name: STEP 08 - Inspect Parquet integrity
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          import pandas as pd
          p=Path('data/raw/EURUSD/EURUSD_M5.parquet'); m=Path('data/metadata/EURUSD_M5.json')
          df=pd.read_parquet(p); meta=json.loads(m.read_text())
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == meta['sha256']
          assert not df.empty
          assert list(df.columns)==['timestamp','open','high','low','close','volume']
          assert df.timestamp.is_monotonic_increasing and not df.timestamp.duplicated().any()
          assert not (df.high < df[['open','close']].max(axis=1)).any()
          assert not (df.low > df[['open','close']].min(axis=1)).any()
          assert not (df.high < df.low).any()
          print('rows=',len(df)); print('first=',df.timestamp.iloc[0]); print('last=',df.timestamp.iloc[-1]); print('sha256=',digest)
          PY

      - name: STEP 09 - Run test suite
        shell: bash
        run: |
          set -euxo pipefail
          pytest -q --disable-warnings --maxfail=1

      - name: STEP 10 - Upload dataset and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD_M5-diagnostic-${{ github.run_id }}
          path: |
            data/raw/EURUSD/EURUSD_M5.parquet
            data/metadata/EURUSD_M5.json
            data/metadata/EURUSD_M5.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: STEP 11 - Final status
        if: always()
        shell: bash
        run: |
          echo "workflow_run_id=${{ github.run_id }}"
          echo "sha=${{ github.sha }}"
          echo "job_status=${{ job.status }}"
